version: "3.8"

services:
  certificates:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evenday-certificates
    ports:
      - "3000:3000"
    environment:
      # Database
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}

      # API Externa
      - EVDAY_API_URL=${EVDAY_API_URL}
      - EVDAY_API_KEY=${EVDAY_API_KEY}

      # Storage (S3/Wasabi)
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL}

      # Next.js
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1

    volumes:
      # Volume para armazenamento local de certificados
      - certificates-storage:/app/storage

    restart: unless-stopped

    # Healthcheck
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  certificates-storage:
    driver: local
